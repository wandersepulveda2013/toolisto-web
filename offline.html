<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin conexión · Toolisto</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { align-items: center; background: #f5f4ef; color: #1c1d21; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; box-sizing: border-box; }
    main { background: #fff; border: 1px solid #d9d7cf; border-radius: 16px; max-width: 540px; padding: 32px; text-align: center; }
    h1 { font-size: clamp(1.5rem, 5vw, 2rem); margin: 0 0 12px; }
    p { line-height: 1.55; margin: 0 0 24px; }
    a { background: #2563eb; border-radius: 8px; color: #fff; display: inline-block; font-weight: 700; padding: 12px 18px; text-decoration: none; }
    a:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 3px; }
    @media (prefers-color-scheme: dark) { body { background: #15161a; color: #f5f4ef; } main { background: #22242a; border-color: #454851; } }
  </style>
</head>
<body>
  <main>
    <h1>Esta herramienta aún no está disponible sin conexión</h1>
    <p>Vuelve a conectarte y abre esta herramienta una vez para poder usarla offline después.</p>
    <a href="/toolisto">Ir al inicio de Toolisto</a>
  </main>
</body>
</html>
